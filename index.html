<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대호 차량관리</title>
<meta name="theme-color" content="#04070D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<style>
:root{--bg:#04070D;--card:rgba(22,28,41,.72);--card2:#121826;--line:rgba(255,255,255,.07);--line2:rgba(34,211,238,.35);--txt:#ECEFF4;--sub:#8B93A3;--gold:#22D3EE;--gold1:#A5F3FC;--gold2:#0E7490;--red:#FF6259;--yel:#F2B84B;--grn:#3DD68C;--blue:#6EA8FF;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--txt);font-size:15px;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;min-height:100vh;
 background:radial-gradient(900px 500px at -10% -10%,rgba(34,211,238,.10),transparent 60%),radial-gradient(800px 600px at 110% 110%,rgba(59,130,246,.10),transparent 60%),var(--bg);background-attachment:fixed;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
header{position:sticky;top:0;z-index:20;padding:12px 16px calc(12px);padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;background:rgba(7,9,14,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1px var(--line2),0 6px 16px rgba(0,0,0,.5)}
.brand b{display:block;white-space:nowrap;font-size:15px;letter-spacing:.18em;font-weight:800;background:linear-gradient(180deg,var(--gold1),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{display:block;font-size:11px;color:var(--sub);letter-spacing:.04em}
.chip{border:1px solid var(--line2);color:var(--gold1);border-radius:20px;padding:5px 11px;font-size:12px;white-space:nowrap;background:rgba(34,211,238,.06)}
.hbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:.2s}
.hbtn:hover{border-color:var(--line2);color:var(--gold1)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(10,13,20,.86);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;padding:6px 0;cursor:pointer;position:relative;transition:color .2s;font-family:inherit}
nav button .ic{width:22px;height:22px}
nav button.on{color:var(--gold1)}
nav button.on::before{content:"";position:absolute;top:-8px;width:28px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 12px var(--gold)}
main{padding:16px;max-width:1500px;margin:0 auto;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04);animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.list>.card:nth-child(2){animation-delay:.04s}.list>.card:nth-child(3){animation-delay:.08s}.list>.card:nth-child(4){animation-delay:.12s}.list>.card:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.click{cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
.click:hover{border-color:var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.35),0 0 0 1px rgba(34,211,238,.08)}
.click:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.big{font-size:19px;font-weight:800;letter-spacing:.02em}
.sub{color:var(--sub);font-size:13px}
.plate{display:inline-flex;align-items:center;padding:3px 10px;border-radius:8px;background:linear-gradient(180deg,#F6F7F9,#D9DDE3);color:#11151C;font-weight:800;letter-spacing:.04em;font-size:15px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(32,40,58,.85),rgba(15,19,29,.85));border:1px solid var(--line);border-radius:18px;padding:14px 12px;animation:rise .45s both}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent)}
.kpi b{display:block;white-space:nowrap;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--txt);letter-spacing:-.02em}
.kpi b.gold{background:linear-gradient(180deg,var(--gold1),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{font-size:11px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(110,168,255,.12);color:var(--blue);font-weight:700;white-space:nowrap}
.b-red{background:rgba(255,98,89,.14);color:var(--red)}.b-yel{background:rgba(242,184,75,.14);color:var(--yel)}.b-grn{background:rgba(61,214,140,.13);color:var(--grn)}.b-gray{background:rgba(255,255,255,.07);color:var(--sub)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.alert{position:relative;padding-left:20px}
.alert::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--yel);box-shadow:0 0 12px var(--yel)}
.alert.over::before{background:var(--red);box-shadow:0 0 12px var(--red)}
h2{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:22px 2px 10px;color:var(--gold)}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
h2 .ic{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:#03141A;background:linear-gradient(180deg,var(--gold1),var(--gold) 55%,#0891B2);box-shadow:0 8px 20px rgba(34,211,238,.22),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s,filter .2s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn.sec{background:rgba(255,255,255,.04);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.sec:hover{border-color:var(--line2);color:var(--gold1)}
.btn.red{background:linear-gradient(180deg,#FF7A72,#E5443B);color:#fff;box-shadow:0 8px 20px rgba(255,98,89,.2)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45}
.fab{position:fixed;right:18px;bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;padding:0;z-index:25;box-shadow:0 12px 30px rgba(34,211,238,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#0C1019;color:var(--txt);font-family:inherit;transition:border-color .2s,box-shadow .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
input::placeholder,textarea::placeholder{color:#4D5566}
label.f{display:block;margin-bottom:12px;font-size:12px;color:var(--sub);letter-spacing:.02em}
label.f>input,label.f>select,label.f>textarea{margin-top:6px}
.req::after{content:" •";color:var(--gold)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters>*{flex:1;min-width:130px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;font-size:11px;letter-spacing:.06em}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
.bar{height:4px;border-radius:4px;margin-top:5px;background:linear-gradient(90deg,var(--gold2),var(--gold1));box-shadow:0 0 10px rgba(34,211,238,.4)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;font-size:14px}
.kv dt{color:var(--sub);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:linear-gradient(180deg,#151B29,#0C1019);border:1px solid var(--line);border-bottom:0;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.8,.2,1)}
.modal::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.modal h3{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:rgba(28,34,48,.95);border:1px solid var(--line2);color:var(--gold1);padding:11px 20px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90%;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--sub);padding:34px 0}
.empty .ic{width:34px;height:34px;color:var(--gold);opacity:.8;margin-bottom:8px}
.perm{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.perm label{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:7px 11px;border-radius:10px;font-size:13px;cursor:pointer;transition:.2s}
.perm label:has(input:checked){border-color:var(--line2);background:rgba(34,211,238,.10);color:var(--gold1)}
.perm input{width:auto;accent-color:var(--gold)}
.link{font-size:12px;color:var(--sub);word-break:break-all;background:#0A0E16;border:1px dashed var(--line);padding:8px 10px;border-radius:10px;margin:8px 0;font-family:ui-monospace,Menlo,monospace}
#loader{position:fixed;inset:0;background:radial-gradient(600px 400px at 50% 40%,rgba(34,211,238,.10),transparent 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:90;gap:22px;color:var(--sub);font-size:12px;letter-spacing:.3em}
#loader img{width:96px;height:96px;border-radius:24px;box-shadow:0 0 0 1px var(--line2),0 20px 60px rgba(34,211,238,.18);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 0 1px var(--gold),0 20px 70px rgba(34,211,238,.3)}}
.track{width:140px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.track i{display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--gold1),transparent);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#shutdown{position:fixed;inset:0;background:var(--bg);z-index:95;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;flex-direction:column;gap:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.quick .btn{padding:14px}
@media(max-width:600px){
  .brand b{font-size:14px;letter-spacing:.12em}
  .chip{max-width:96px;overflow:hidden;text-overflow:ellipsis;padding:5px 9px;font-size:11px}
  .hbtn{width:36px;height:36px}
  .kpi b{font-size:19px}
}
@media(min-width:900px){
  body{padding-bottom:0}
  .modal-bg{align-items:center}.modal{border-radius:24px;border-bottom:1px solid var(--line)}.modal::before{display:none}
  .wrap{display:flex;max-width:1680px;margin:0 auto}
  nav{position:sticky;top:63px;bottom:auto;flex-direction:column;justify-content:flex-start;gap:4px;width:230px;height:calc(100vh - 63px);padding:18px 12px;border-top:0;border-right:1px solid var(--line);background:rgba(10,13,20,.5)}
  nav button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:12px 14px;border-radius:12px;justify-content:flex-start}
  nav button:hover{background:rgba(255,255,255,.03);color:var(--txt)}
  nav button.on{background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(34,211,238,.02));box-shadow:inset 0 0 0 1px rgba(34,211,238,.18)}
  nav button.on::before{top:12px;bottom:12px;left:0;width:3px;height:auto;background:var(--gold)}
  main{flex:1;padding:26px 30px}
  .kpis{grid-template-columns:repeat(3,minmax(0,280px))}
  .kpi{padding:20px}.kpi b{font-size:28px}
  .quick{grid-template-columns:repeat(2,minmax(0,220px))}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .list .card{margin:0}
  .fab{bottom:28px;right:28px}
  .toast{bottom:30px}
}

/* ===== 계기판 테마 ===== */
.kpis{gap:12px}
.kpi{border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;border:0;background:radial-gradient(circle at 50% 40%,#0E1B2E,#04070D 70%);box-shadow:0 0 28px rgba(34,211,238,.14),inset 0 0 22px rgba(34,211,238,.08)}
.kpi::before{content:"";position:absolute;inset:0;border-radius:50%;padding:2px;background:conic-gradient(from 220deg,#22D3EE 0deg,#22D3EE var(--deg,200deg),rgba(34,211,238,.12) var(--deg,200deg),rgba(34,211,238,.12) 280deg,transparent 280deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.kpi::after{display:none}
.kpi.warn::before{background:conic-gradient(from 220deg,#FF6259 0deg,#FF6259 var(--deg,200deg),rgba(255,98,89,.15) var(--deg,200deg),rgba(255,98,89,.15) 280deg,transparent 280deg)}
.kpi.warn{box-shadow:0 0 28px rgba(255,98,89,.16),inset 0 0 22px rgba(255,98,89,.08)}
.kpi b{font-size:19px;line-height:1.15}
.kpi span{font-size:10px;margin-top:3px}
.plate{background:#0A1524;color:#A5F3FC;box-shadow:inset 0 0 0 1px rgba(34,211,238,.55),0 0 12px rgba(34,211,238,.18);font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em}
.card{background:linear-gradient(135deg,rgba(14,25,42,.88),rgba(6,10,18,.88));border-color:rgba(34,211,238,.10)}
h2{color:var(--gold)}
.brand b{background:linear-gradient(180deg,#E0FDFF,#22D3EE);-webkit-background-clip:text;background-clip:text}
@media(max-width:600px){.kpi b{font-size:16px}.kpi span{font-size:9.5px;letter-spacing:.02em}}
@media(min-width:900px){.kpis{grid-template-columns:repeat(3,190px);gap:22px}.kpi b{font-size:26px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>

<div id="loader"><img src="icon-192.png" alt=""><div class="track"><i></i></div><div>DAEHO FLEET</div></div>

<header>
  <div class="brand"><img src="icon-192.png" alt=""><div><b>DAEHO FLEET</b><span>대호 차량관리</span></div></div>
  <span class="chip" id="who"></span>
  <button class="hbtn" id="xlsBtn" title="엑셀 다운로드" style="display:none" onclick="exportXlsx()"><svg class="ic"><use href="#i-down"/></svg></button>

<script>
/* ===== 설정: Apps Script 웹앱 URL을 붙여넣으세요 ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyXzF3AeDztpzertPOy1lR3XSCsuvIjMmO0URGb-75yjuWp_YXBOpkmbVmLFgzzG8ZHnA/exec';

const qs = new URLSearchParams(location.search);
let K = qs.get('k') || '';
try { if (K) localStorage.setItem('dc_k', K); else K = localStorage.getItem('dc_k') || ''; } catch(e){}

let S = { user:null, settings:{}, cars:[], maint:[], costs:[] };
let TAB = 'home';
const F = { carQ:'', mCar:'', mMonth:'', cCar:'', cMonth:'', year:String(new Date().getFullYear()) };

/* ===== 공통 ===== */
const ic = (n,sz) => `<svg class="ic"${sz?` style="width:${sz}px;height:${sz}px"`:''}><use href="#i-${n}"/></svg>`;
const TABI = {home:'home',cars:'car',maint:'wrench',cost:'fuel',stats:'chart',admin:'sliders'};
function countUp(){ document.querySelectorAll('[data-n]').forEach(el=>{ const to=+el.dataset.n, w=el.dataset.won, t0=performance.now(); if(!to) return;
  const step=t=>{ const p=Math.min(1,(t-t0)/700), v=Math.round(to*(1-Math.pow(1-p,3))); el.textContent = w?won(v):num(v); if(p<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }); }

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Number(n)||0).toLocaleString('ko-KR') + '원';
const num = n => (Number(n)||0).toLocaleString('ko-KR');
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const can = p => S.user && (S.user.role==='super' || S.user.perms[p]);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function daysLeft(s){ if(!s) return null; const d=new Date(String(s).slice(0,10)+'T00:00:00'); if(isNaN(d)) return null; const t=new Date(today()+'T00:00:00'); return Math.round((d-t)/86400000); }
function dBadge(d){ if(d===null) return ''; if(d<0) return `<span class="badge b-red">${-d}일 지남</span>`; if(d===0) return `<span class="badge b-red">오늘</span>`; return `<span class="badge ${d<=7?'b-red':'b-yel'}">D-${d}</span>`; }
const carById = id => S.cars.find(c=>c.ID===id);
const carOpts = (sel, all) => (all?`<option value="">${all}</option>`:'') + S.cars.slice().sort((a,b)=>String(a.차량번호).localeCompare(b.차량번호)).map(c=>`<option value="${esc(c.ID)}" ${c.ID===sel?'selected':''}>${esc(c.차량번호)} ${esc(c.차종||'')}</option>`).join('');

async function api(action, data){
  if (API_URL.startsWith('PASTE')) throw new Error('index.html의 API_URL을 먼저 설정하세요');
  let r;
  try { r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ k:K, action, data }) }); }
  catch(e){ throw new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.'); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('서버 응답 오류입니다. 잠시 후 다시 시도해 주세요.'); }
  if (!j.ok){ if (j.serviceOff) showShutdown(j.error); throw new Error(j.error || '오류'); }
  return j;
}
function showShutdown(m){ $('shutMsg').textContent=m||''; $('shutdown').style.display='flex'; $('loader').style.display='none'; }

async function reload(silent){
  if(!silent) $('loader').style.display='flex';
  try {
    const j = await api('load');
    S.user=j.user; S.settings=j.settings; S.cars=j.cars; S.maint=j.maint; S.costs=j.costs;
    $('who').textContent = S.user.name + (S.user.role==='super' && innerWidth>600 ?' · 최고관리자':'');
    $('xlsBtn').style.display = can('엑셀') ? '' : 'none';
    renderNav(); render();
  } catch(e){
    if(!S.user) $('main').innerHTML = `<div class="card empty">⚠️ ${esc(e.message)}<br><br><span class="sub">회사에서 받은 접속 링크로 다시 들어와 주세요.</span></div>`;
    else toast(e.message);
  }
  $('loader').style.display='none';
}

/* ===== 탭 ===== */
function tabs(){
  const t=[['home','홈'],['cars','차량'],['maint','정비'],['cost','비용']];
  if(can('통계')) t.push(['stats','통계']);
  if(S.user.role==='super') t.push(['admin','관리']);
  return t;
}
function renderNav(){ $('nav').innerHTML = tabs().map(([k,l])=>`<button class="${TAB===k?'on':''}" onclick="go('${k}')">${ic(TABI[k])}<span>${l}</span></button>`).join(''); }
function go(t){ TAB=t; renderNav(); render(); window.scrollTo(0,0); }
function render(){
  const v = {home:vHome, cars:vCars, maint:vMaint, cost:vCost, stats:vStats, admin:vAdmin}[TAB] || vHome;
  $('main').innerHTML = v();
  if(TAB==='admin') loadUsers();
  countUp();
}

/* ===== 알림 계산 ===== */
function alerts(){
  const N = S.settings.알림일수 || 30, out=[];
  const F2 = [['보험만기','보험 만기'],['검사만기','정기검사'],['계약만기','리스/렌트 계약 만기'],['자동차세','자동차세 납부']];
  S.cars.forEach(c=>{
    if(c.상태==='매각') return;
    F2.forEach(([k,l])=>{ const d=daysLeft(c[k]); if(d!==null && d<=N) out.push({car:c, label:l, d, date:c[k]}); });
  });
  // 정비 예정: 차량+구분별 가장 최근 기록만
  const last={};
  S.maint.forEach(m=>{ const key=m.차량ID+'|'+m.구분; if(!last[key] || String(m.날짜)>String(last[key].날짜)) last[key]=m; });
  Object.values(last).forEach(m=>{
    const c=carById(m.차량ID); if(!c || c.상태==='매각') return;
    const d=daysLeft(m.다음교체일);
    if(d!==null && d<=N) out.push({car:c, label:m.구분+' 교체 예정', d, date:m.다음교체일});
    if(m.다음교체km){ const left=Number(m.다음교체km)-(Number(c.현재km)||0); if(left<=1000) out.push({car:c, label:`${m.구분} 교체 (${num(m.다음교체km)}km)`, d: left<0?-1:9999, km:left}); }
  });
  return out.sort((a,b)=>a.d-b.d);
}

/* ===== 홈 ===== */
function vHome(){
  const ym=today().slice(0,7);
  const mSum = S.maint.filter(m=>String(m.날짜).startsWith(ym)).reduce((s,m)=>s+(Number(m.비용)||0),0);
  const cSum = S.costs.filter(c=>String(c.날짜).startsWith(ym)).reduce((s,c)=>s+(Number(c.금액)||0),0);
  const al = alerts();
  const running = S.cars.filter(c=>c.상태!=='매각').length;
  let h = `<div class="kpis">
    <div class="kpi" style="--deg:280deg"><b class="gold" data-n="${running}">${running}</b><span>보유 차량</span></div>
    <div class="kpi ${al.length?'warn':''}" style="--deg:${Math.min(280,40+al.length*40)}deg"><b style="${al.length?'color:var(--red)':''}" data-n="${al.length}">${al.length}</b><span>알림</span></div>
    <div class="kpi"><b data-n="${mSum+cSum}" data-won="1">${won(mSum+cSum)}</b><span>이번 달 비용</span></div>
  </div>`;
  if(can('입력')) h += `<div class="quick"><button class="btn sec" onclick="maintForm()">${ic('wrench')} 정비 등록</button><button class="btn sec" onclick="costForm()">${ic('fuel')} 비용 등록</button></div>`;
  h += `<h2>${ic('bell')} 확인이 필요한 항목</h2>`;
  if(!al.length) h += `<div class="card empty">${ic('check')}<br>임박한 만기나 정비 예정이 없습니다</div>`;
  else h += `<div class="list">` + al.map(a=>`<div class="card alert ${a.d<0?'over':''} click" onclick="carDetail('${a.car.ID}')">
      <div class="row"><span class="plate">${esc(a.car.차량번호)}</span><span class="sub">${esc(a.car.차종||'')}</span><span class="sp"></span>${a.km!==undefined ? `<span class="badge ${a.km<0?'b-red':'b-yel'}">${a.km<0?num(-a.km)+'km 초과':num(a.km)+'km 남음'}</span>` : dBadge(a.d)}</div>
      <div class="sub" style="margin-top:4px">${esc(a.label)}${a.date?' · '+esc(a.date):''}</div></div>`).join('') + `</div>`;
  if(!S.cars.length) h += `<div class="card empty">아직 등록된 차량이 없습니다.<br>${can('차량관리')?'<br><button class="btn" onclick="carForm()">'+ic('plus')+' 첫 차량 등록</button>':''}</div>`;
  return h;
}

/* ===== 차량 ===== */
function vCars(){
  const q=F.carQ.trim();
  const list = S.cars.filter(c=>!q || [c.차량번호,c.차종,c.담당자].join(' ').includes(q))
    .sort((a,b)=>(a.상태==='매각')-(b.상태==='매각') || String(a.차량번호).localeCompare(b.차량번호));
  const al = alerts();
  let h = `<div class="filters"><input placeholder="차량번호 · 차종 · 담당자 검색" value="${esc(F.carQ)}" oninput="F.carQ=this.value;clearTimeout(this._t);this._t=setTimeout(()=>{render();const i=document.querySelector('main input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"></div>`;
  if(!list.length) h += `<div class="card empty">차량이 없습니다</div>`;
  h += `<div class="list">` + list.map(c=>{
    const n = al.filter(a=>a.car.ID===c.ID).length;
    const st = c.상태||'운행';
    return `<div class="card click" onclick="carDetail('${c.ID}')" style="${st==='매각'?'opacity:.55':''}">
      <div class="row"><span class="plate">${esc(c.차량번호)}</span><span class="sp"></span>${n?`<span class="badge b-red">알림 ${n}</span>`:''}<span class="badge ${st==='운행'?'b-grn':st==='정비중'?'b-yel':'b-gray'}"><i class="dot"></i>${esc(st)}</span></div>
      <div class="sub" style="margin-top:4px">${esc([c.차종,c.연식&&c.연식+'년식',c.연료].filter(Boolean).join(' · '))}</div>
      <div class="row sub" style="margin-top:6px"><span class="row" style="gap:5px">${ic('user',16)}${esc(c.담당자||'-')}</span><span class="sp"></span><span>${num(c.현재km)} km</span></div>
    </div>`;}).join('') + `</div>`;
  if(can('차량관리')) h += `<button class="btn fab" onclick="carForm()">${ic('plus')}</button>`;
  return h;
}

function carDetail(id){
  const c=carById(id); if(!c) return;
  const y=F.year;
  const ms=S.maint.filter(m=>m.차량ID===id).sort((a,b)=>String(b.날짜).localeCompare(a.날짜));
  const cs=S.costs.filter(x=>x.차량ID===id).sort((a,b)=>String(b.날짜).localeCompare(a.날짜));
  const tot = ms.filter(m=>String(m.날짜).startsWith(y)).reduce((s,m)=>s+(+m.비용||0),0) + cs.filter(x=>String(x.날짜).startsWith(y)).reduce((s,x)=>s+(+x.금액||0),0);
  const dd = k => c[k] ? esc(c[k])+' '+dBadge(daysLeft(c[k])) : '-';
  let h = `<h3><span class="plate">${esc(c.차량번호)}</span><span class="sp"></span><button class="btn sec sm" onclick="closeModal()">닫기</button></h3>
  <dl class="kv">
    <dt>차종</dt><dd>${esc(c.차종||'-')} ${c.연식?esc(c.연식)+'년식':''} ${esc(c.연료||'')}</dd>
    <dt>담당자</dt><dd>${esc(c.담당자||'-')}</dd>
    <dt>상태</dt><dd>${esc(c.상태||'운행')}</dd>
    <dt>현재 km</dt><dd>${num(c.현재km)} km</dd>
    <dt>보험 만기</dt><dd>${dd('보험만기')}</dd>
    <dt>정기검사</dt><dd>${dd('검사만기')}</dd>
    <dt>계약 만기</dt><dd>${dd('계약만기')}</dd>
    <dt>자동차세</dt><dd>${dd('자동차세')}</dd>
    <dt>${y}년 비용</dt><dd><b>${won(tot)}</b></dd>
    ${c.메모?`<dt>메모</dt><dd>${esc(c.메모)}</dd>`:''}
  </dl>
  <div class="row" style="margin:14px 0;flex-wrap:wrap">
    ${can('입력')?`<button class="btn sec sm" onclick="maintForm(null,'${id}')">${ic('plus',16)} 정비</button><button class="btn sec sm" onclick="costForm(null,'${id}')">${ic('plus',16)} 비용</button>`:''}
    <span class="sp"></span>
    ${can('차량관리')?`<button class="btn sm" onclick="carForm('${id}')">수정</button>`:''}
    ${can('삭제')?`<button class="btn red sm" onclick="askDelete('car','${id}','${esc(c.차량번호)}')">삭제</button>`:''}
  </div>
  <h2>${ic('wrench')} 정비 이력 (${ms.length})</h2>${miniList(ms.slice(0,10),'maint')}
  <h2>${ic('fuel')} 비용 기록 (${cs.length})</h2>${miniList(cs.slice(0,10),'cost')}`;
  openModal(h);
}
function miniList(arr,type){
  if(!arr.length) return `<div class="sub" style="padding:6px 2px">기록 없음</div>`;
  return arr.map(r=>`<div class="row click" style="padding:8px 2px;border-bottom:1px solid var(--line)" onclick="${type==='maint'?`maintForm('${r.ID}')`:`costForm('${r.ID}')`}">
    <span class="sub">${esc(r.날짜)}</span><span>${esc(type==='maint'?r.구분:r.항목)}</span><span class="sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px">${esc(r.내용||r.메모||'')}</span><span class="sp"></span><b>${won(type==='maint'?r.비용:r.금액)}</b></div>`).join('');
}

  const c = id ? carById(id) : {};
  formModal(id?'차량 수정':'차량 등록', [
    {k:'차량번호',label:'차량번호',req:1,ph:'12가 3456'},
    {k:'차종',label:'차종',ph:'포터2, 쏘렌토…'},
    {k:'연식',label:'연식',type:'number',ph:'2023',half:1},
    {k:'연료',label:'연료',type:'select',opts:['','경유','휘발유','LPG','전기','하이브리드'],half:1},
    {k:'담당자',label:'담당자(주 운전자)',half:1},
    {k:'상태',label:'상태',type:'select',opts:S.settings.차량상태||['운행'],half:1},
    {k:'현재km',label:'현재 주행거리(km)',type:'number'},
    {k:'보험만기',label:'보험 만기일',type:'date',half:1},
    {k:'검사만기',label:'정기검사 만기일',type:'date',half:1},
    {k:'계약만기',label:'리스/렌트 만기일',type:'date',half:1},
    {k:'자동차세',label:'자동차세 납부일',type:'date',half:1},
    {k:'메모',label:'메모',type:'textarea'}
  ], c, async d => { if(id) d.ID=id; await api('saveCar', d); toast('저장되었습니다'); });
}

/* ===== 정비 ===== */
function filterRecs(arr, car, month){ return arr.filter(r=>(!car||r.차량ID===car) && (!month||String(r.날짜).startsWith(month))).sort((a,b)=>String(b.날짜).localeCompare(a.날짜)); }
function vMaint(){
  const list=filterRecs(S.maint,F.mCar,F.mMonth);
  const sum=list.reduce((s,m)=>s+(+m.비용||0),0);
  let h=`<div class="filters"><select onchange="F.mCar=this.value;render()">${carOpts(F.mCar,'전체 차량')}</select><input type="month" value="${F.mMonth}" onchange="F.mMonth=this.value;render()"></div>
  <div class="card row"><span class="sub">${list.length}건</span><span class="sp"></span><b>합계 ${won(sum)}</b></div>`;
  if(!list.length) h+=`<div class="card empty">정비 기록이 없습니다</div>`;
  h+=`<div class="list">`+list.map(m=>`<div class="card click" onclick="maintForm('${m.ID}')">
    <div class="row"><span class="plate">${esc(m.차량번호)}</span><span class="badge">${esc(m.구분||'-')}</span><span class="sp"></span><b>${won(m.비용)}</b></div>
    <div class="sub" style="margin-top:4px">${esc(m.날짜)} · ${esc(m.업체||'')} ${m.km?'· '+num(m.km)+'km':''}</div>
    ${m.내용?`<div style="margin-top:4px;font-size:14px">${esc(m.내용)}</div>`:''}
    ${m.다음교체일||m.다음교체km?`<div class="sub" style="margin-top:4px">다음: ${esc(m.다음교체일||'')} ${m.다음교체km?num(m.다음교체km)+'km':''}</div>`:''}
  </div>`).join('')+`</div>`;
  if(can('입력')) h+=`<button class="btn fab" onclick="maintForm()">${ic('plus')}</button>`;
  return h;
}
function maintForm(id, carId){
  const m = id ? S.maint.find(x=>x.ID===id) : {차량ID:carId||F.mCar||'', 날짜:today()};
  if(!m) return;
  formModal(id?'정비 기록':'정비 등록', [
    {k:'차량ID',label:'차량',type:'car',req:1},
    {k:'날짜',label:'날짜',type:'date',req:1,half:1},
    {k:'구분',label:'구분',type:'select',opts:S.settings.정비구분||['기타'],half:1},
    {k:'내용',label:'정비 내용',ph:'엔진오일+필터 교환'},
    {k:'업체',label:'정비 업체',half:1},
    {k:'비용',label:'비용(원)',type:'number',half:1},
    {k:'km',label:'정비 시 주행거리(km)',type:'number'},
    {k:'다음교체km',label:'다음 교체 km',type:'number',half:1},
    {k:'다음교체일',label:'다음 교체일',type:'date',half:1},
    {k:'메모',label:'메모',type:'textarea'}
  ], m, async d => { if(id) d.ID=id; await api('saveMaint', d); toast('저장되었습니다'); },
  id && can('삭제') ? ()=>askDelete('maint',id,m.차량번호+' '+m.구분) : null, !can('입력'));
}

/* ===== 비용 ===== */
function vCost(){
  const list=filterRecs(S.costs,F.cCar,F.cMonth);
  const sum=list.reduce((s,c)=>s+(+c.금액||0),0);
  const byItem={}; list.forEach(c=>byItem[c.항목]=(byItem[c.항목]||0)+(+c.금액||0));
  let h=`<div class="filters"><select onchange="F.cCar=this.value;render()">${carOpts(F.cCar,'전체 차량')}</select><input type="month" value="${F.cMonth}" onchange="F.cMonth=this.value;render()"></div>
  <div class="card"><div class="row"><span class="sub">${list.length}건</span><span class="sp"></span><b>합계 ${won(sum)}</b></div>
  ${Object.keys(byItem).length?`<div class="sub" style="margin-top:6px">${Object.entries(byItem).map(([k,v])=>esc(k)+' '+won(v)).join(' · ')}</div>`:''}</div>`;
  if(!list.length) h+=`<div class="card empty">비용 기록이 없습니다</div>`;
  h+=`<div class="list">`+list.map(c=>`<div class="card click" onclick="costForm('${c.ID}')">
    <div class="row"><span class="plate">${esc(c.차량번호)}</span><span class="badge">${esc(c.항목||'-')}</span><span class="sp"></span><b>${won(c.금액)}</b></div>
    <div class="sub" style="margin-top:4px">${esc(c.날짜)} ${c.리터?'· '+c.리터+'L':''} ${c.km?'· '+num(c.km)+'km':''} ${c.메모?'· '+esc(c.메모):''}</div></div>`).join('')+`</div>`;
  if(can('입력')) h+=`<button class="btn fab" onclick="costForm()">${ic('plus')}</button>`;
  return h;
}
function costForm(id, carId){
  const c = id ? S.costs.find(x=>x.ID===id) : {차량ID:carId||F.cCar||'', 날짜:today(), 항목:(S.settings.비용항목||[])[0]};
  if(!c) return;
  formModal(id?'비용 기록':'비용 등록', [
    {k:'차량ID',label:'차량',type:'car',req:1},
    {k:'날짜',label:'날짜',type:'date',req:1,half:1},
    {k:'항목',label:'항목',type:'select',opts:S.settings.비용항목||['기타'],half:1},
    {k:'금액',label:'금액(원)',type:'number',req:1,half:1},
    {k:'리터',label:'주유량(L)',type:'number',half:1},
    {k:'km',label:'주행거리(km)',type:'number'},
    {k:'메모',label:'메모'}
  ], c, async d => { if(id) d.ID=id; await api('saveCost', d); toast('저장되었습니다'); },
  id && can('삭제') ? ()=>askDelete('cost',id,c.차량번호+' '+c.항목) : null, !can('입력'));
}

/* ===== 통계 ===== */
function vStats(){
  const y=F.year;
  const ys=[...new Set([...S.maint,...S.costs].map(r=>String(r.날짜).slice(0,4)).concat([String(new Date().getFullYear())]))].filter(Boolean).sort().reverse();
  const M=S.maint.filter(m=>String(m.날짜).startsWith(y)), C=S.costs.filter(c=>String(c.날짜).startsWith(y));
  const per={};
  S.cars.forEach(c=>per[c.ID]={no:c.차량번호, m:0, c:0});
  M.forEach(m=>{ if(per[m.차량ID]) per[m.차량ID].m+=(+m.비용||0); });
  C.forEach(c=>{ if(per[c.차량ID]) per[c.차량ID].c+=(+c.금액||0); });
  const rows=Object.values(per).map(r=>({...r,t:r.m+r.c})).sort((a,b)=>b.t-a.t);
  const max=Math.max(1,...rows.map(r=>r.t));
  const mon=Array.from({length:12},(_,i)=>({m:0,c:0}));
  M.forEach(m=>{ const i=+String(m.날짜).slice(5,7)-1; if(i>=0) mon[i].m+=(+m.비용||0); });
  C.forEach(c=>{ const i=+String(c.날짜).slice(5,7)-1; if(i>=0) mon[i].c+=(+c.금액||0); });
  const items={}; C.forEach(c=>items[c.항목]=(items[c.항목]||0)+(+c.금액||0)); M.forEach(m=>items['정비:'+m.구분]=(items['정비:'+m.구분]||0)+(+m.비용||0));
  const totM=M.reduce((s,m)=>s+(+m.비용||0),0), totC=C.reduce((s,c)=>s+(+c.금액||0),0);
  return `<div class="filters"><select onchange="F.year=this.value;render()">${ys.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select></div>
  <div class="kpis"><div class="kpi"><b class="gold" data-n="${totM+totC}" data-won="1">${won(totM+totC)}</b><span>${y}년 총비용</span></div><div class="kpi"><b data-n="${totM}" data-won="1">${won(totM)}</b><span>정비비</span></div><div class="kpi"><b data-n="${totC}" data-won="1">${won(totC)}</b><span>운영비</span></div></div>
  <h2>차량별 비용</h2><div class="card tbl"><table><tr><th>차량</th><th>정비</th><th>운영비</th><th>합계</th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.no)}<div class="bar" style="width:${Math.round(r.t/max*100)}%"></div></td><td>${num(r.m)}</td><td>${num(r.c)}</td><td><b>${num(r.t)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="sub">데이터 없음</td></tr>'}</table></div>
  <h2>월별 비용</h2><div class="card tbl"><table><tr><th>월</th><th>정비</th><th>운영비</th><th>합계</th></tr>
  ${mon.map((r,i)=>`<tr><td>${i+1}월</td><td>${num(r.m)}</td><td>${num(r.c)}</td><td><b>${num(r.m+r.c)}</b></td></tr>`).join('')}</table></div>
  <h2>항목별 비용</h2><div class="card tbl"><table><tr><th>항목</th><th>금액</th></tr>
  ${Object.entries(items).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${num(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="sub">데이터 없음</td></tr>'}</table></div>`;
}

/* ===== 관리 (최고관리자) ===== */
const PERMS=['차량관리','입력','삭제','통계','엑셀'];
const PERM_DESC={차량관리:'차량 등록·수정',입력:'정비·비용 입력',삭제:'기록 삭제',통계:'통계 보기',엑셀:'엑셀 다운로드'};
let USERS=[];
function vAdmin(){
  const s=S.settings;
  return `<h2>${ic('users')} 사용자 · 권한</h2><div id="users"><div class="card empty">불러오는 중…</div></div>
  <button class="btn sec" style="width:100%;margin-bottom:6px" onclick="userForm()">${ic('plus')} 사용자 추가</button>
  <h2>${ic('sliders')} 설정</h2><div class="card">
    <label class="f">서비스 상태 <select id="s_svc"><option ${s.서비스상태!=='OFF'?'selected':''}>ON</option><option ${s.서비스상태==='OFF'?'selected':''}>OFF</option></select></label>
    <label class="f">만기 알림 (며칠 전부터) <input id="s_days" type="number" value="${s.알림일수||30}"></label>
    <label class="f">정비 구분 (쉼표로 구분) <input id="s_m" value="${esc((s.정비구분||[]).join(','))}"></label>
    <label class="f">비용 항목 (쉼표로 구분) <input id="s_c" value="${esc((s.비용항목||[]).join(','))}"></label>
    <label class="f">차량 상태 (쉼표로 구분) <input id="s_st" value="${esc((s.차량상태||[]).join(','))}"></label>
    <button class="btn" style="width:100%" onclick="saveSettings(this)">설정 저장</button>
  </div>`;
}
async function loadUsers(){
  try { USERS=(await api('users')).users; drawUsers(); } catch(e){ $('users').innerHTML=`<div class="card empty">${esc(e.message)}</div>`; }
}
const linkOf = k => location.origin + location.pathname + '?k=' + encodeURIComponent(k);
function drawUsers(){
  if(!$('users')) return;
  $('users').innerHTML = USERS.map((u,i)=>{
    const sup=u.역할==='super';
    return `<div class="card" style="${u.활성==='N'?'opacity:.6':''}">
      <div class="row"><b>${esc(u.이름)}</b>${sup?'<span class="badge">최고관리자</span>':''}${u.활성==='N'?'<span class="badge b-red">차단됨</span>':''}<span class="sp"></span>
        <button class="btn sec sm" onclick="copyLink(${i})">${ic('link',16)} 링크 복사</button></div>
      ${u.메모?`<div class="sub">${esc(u.메모)}</div>`:''}
      <div class="link">${esc(linkOf(u.키))}</div>
      ${sup?'<div class="sub">모든 권한 (변경 불가)</div>':`
      <div class="perm">${PERMS.map(p=>`<label><input type="checkbox" data-u="${i}" data-p="${p}" ${u[p]==='Y'?'checked':''}> ${PERM_DESC[p]}</label>`).join('')}</div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn sm" onclick="savePerm(${i},this)">권한 저장</button>
        <button class="btn sec sm" onclick="toggleUser(${i})">${u.활성==='N'?'차단 해제':'차단'}</button>
        <button class="btn sec sm" onclick="regen(${i})">링크 재발급</button>
      </div>`}
    </div>`;}).join('');
}
async function copyLink(i){
  const t=linkOf(USERS[i].키);
  try { await navigator.clipboard.writeText(t); toast('링크가 복사되었습니다'); }
  catch(e){ prompt('아래 링크를 복사하세요', t); }
}
async function savePerm(i,btn){
  const u={...USERS[i]};
  document.querySelectorAll(`input[data-u="${i}"]`).forEach(cb=>u[cb.dataset.p]=cb.checked?'Y':'N');
  btn.disabled=true;
  try { await api('saveUser',u); USERS[i]=u; toast(u.이름+' 권한 저장됨'); } catch(e){ toast(e.message); }
  btn.disabled=false;
}
async function toggleUser(i){
  const u={...USERS[i], 활성: USERS[i].활성==='N'?'Y':'N'};
  if(u.활성==='N' && !confirm(u.이름+'님의 접속을 차단할까요?')) return;
  try { await api('saveUser',u); USERS[i]=u; drawUsers(); toast(u.활성==='N'?'차단되었습니다':'차단이 해제되었습니다'); } catch(e){ toast(e.message); }
}
async function regen(i){
  if(!confirm(USERS[i].이름+'님의 링크를 새로 만들까요?\n기존 링크는 더 이상 작동하지 않습니다.')) return;
  try { const j=await api('regenKey',{키:USERS[i].키}); USERS[i].키=j.key; drawUsers(); toast('새 링크가 발급되었습니다'); } catch(e){ toast(e.message); }
}
function userForm(){
  formModal('사용자 추가', [
    {k:'이름',label:'이름',req:1},
    {k:'메모',label:'메모 (부서 등)'},
    ...PERMS.map(p=>({k:p,label:PERM_DESC[p],type:'select',opts:['N','Y'],half:1}))
  ], {입력:'Y', 통계:'Y'}, async d => { await api('saveUser', d); toast('추가되었습니다. 링크를 복사해 전달하세요'); }, null, false, ()=>loadUsers());
}
async function saveSettings(btn){
  btn.disabled=true;
  const sets=[['서비스상태',$('s_svc').value],['알림일수',$('s_days').value],['정비구분',$('s_m').value],['비용항목',$('s_c').value],['차량상태',$('s_st').value]];
  try { for(const [k,v] of sets) await api('setSetting',{항목:k,값:v}); toast('설정이 저장되었습니다'); await reload(true); }
  catch(e){ toast(e.message); }
  btn.disabled=false;
}

/* ===== 모달 / 폼 ===== */
function openModal(html){ closeModal(); const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='mbg'; bg.innerHTML=`<div class="modal">${html}</div>`; bg.onclick=e=>{ if(e.target===bg) closeModal(); }; document.body.appendChild(bg); document.body.style.overflow='hidden'; }
function closeModal(){ const m=$('mbg'); if(m) m.remove(); document.body.style.overflow=''; }

function formModal(title, fields, vals, onSave, onDelete, readOnly, after){
  const fld = f => {
    const v = vals[f.k] ?? '';
    const dis = readOnly ? 'disabled' : '';
    let inp;
    if(f.type==='select') inp=`<select name="${f.k}" ${dis}>${f.opts.map(o=>`<option ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='car') inp=`<select name="${f.k}" ${dis}>${carOpts(v,'차량 선택')}</select>`;
    else if(f.type==='textarea') inp=`<textarea name="${f.k}" rows="2" ${dis}>${esc(v)}</textarea>`;
    else inp=`<input name="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${dis}>`;
    return `<label class="f"><span class="${f.req?'req':''}">${f.label}</span>${inp}</label>`;
  };
  // half 필드는 2개씩 묶기
  let body='', buf=[];
  fields.forEach(f=>{ if(f.half){ buf.push(fld(f)); if(buf.length===2){ body+=`<div class="grid2">${buf.join('')}</div>`; buf=[]; } } else { if(buf.length){ body+=`<div class="grid2">${buf.join('')}</div>`; buf=[]; } body+=fld(f); } });
  if(buf.length) body+=`<div class="grid2">${buf.join('')}</div>`;
  openModal(`<h3>${title}<span class="sp"></span><button class="btn sec sm" onclick="closeModal()">닫기</button></h3>
    <form id="fm">${body}
    ${readOnly?'':`<button class="btn" style="width:100%;margin-top:4px" type="submit">저장</button>`}
    ${onDelete?`<button class="btn red" style="width:100%;margin-top:8px" type="button" id="delBtn">삭제</button>`:''}</form>`);
  if(onDelete) $('delBtn').onclick=onDelete;
  $('fm').onsubmit = async e => {
    e.preventDefault();
    const d={}; new FormData(e.target).forEach((v,k)=>d[k]=String(v).trim());
    const miss=fields.filter(f=>f.req && !d[f.k]);
    if(miss.length) return toast(miss[0].label+'을(를) 입력하세요');
    const b=e.target.querySelector('button[type=submit]'); b.disabled=true; b.textContent='저장 중…';
    try { await onSave(d); closeModal(); if(after) after(); else await reload(true); }
    catch(err){ toast(err.message); b.disabled=false; b.textContent='저장'; }
  };
}

function askDelete(type,id,label){
  openModal(`<h3>삭제 확인</h3><p style="margin-bottom:10px"><b>${esc(label)}</b> 기록을 삭제합니다.<br><span class="sub">시트에는 빨간색으로 남고 앱에서만 숨겨집니다.</span></p>
  <label class="f"><span class="req">삭제 사유</span><textarea id="delReason" rows="2"></textarea></label>
  <div class="row"><button class="btn sec sp" onclick="closeModal()">취소</button><button class="btn red sp" id="delGo">삭제</button></div>`);
  $('delGo').onclick = async () => {
    const reason=$('delReason').value.trim(); if(!reason) return toast('삭제 사유를 입력하세요');
    $('delGo').disabled=true;
    try { await api('del',{type,id,reason}); closeModal(); toast('삭제되었습니다'); await reload(true); }
    catch(e){ toast(e.message); $('delGo').disabled=false; }
  };
}

/* ===== 엑셀 ===== */
function exportXlsx(){
  if(typeof XLSX==='undefined') return toast('엑셀 모듈 로딩 중입니다. 잠시 후 다시 눌러주세요');
  const strip = (arr, cols) => arr.map(r=>{ const o={}; cols.forEach(c=>o[c]=r[c]??''); return o; });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(strip(S.cars,['차량번호','차종','연식','연료','담당자','현재km','상태','보험만기','검사만기','계약만기','자동차세','메모'])), '차량대장');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(strip(S.maint.slice().sort((a,b)=>String(a.날짜).localeCompare(b.날짜)),['날짜','차량번호','구분','내용','업체','비용','km','다음교체km','다음교체일','메모','입력자'])), '정비이력');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(strip(S.costs.slice().sort((a,b)=>String(a.날짜).localeCompare(b.날짜)),['날짜','차량번호','항목','금액','리터','km','메모','입력자'])), '비용내역');
  const y=F.year, per=S.cars.map(c=>{
    const m=S.maint.filter(x=>x.차량ID===c.ID&&String(x.날짜).startsWith(y)).reduce((s,x)=>s+(+x.비용||0),0);
    const k=S.costs.filter(x=>x.차량ID===c.ID&&String(x.날짜).startsWith(y)).reduce((s,x)=>s+(+x.금액||0),0);
    return {차량번호:c.차량번호, 차종:c.차종, ['정비비('+y+')']:m, ['운영비('+y+')']:k, 합계:m+k};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(per), '차량별비용_'+y);
  XLSX.writeFile(wb, '대호차량관리_'+today()+'.xlsx');
}

reload();
