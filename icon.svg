<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#232C3F"/>
      <stop offset=".55" stop-color="#0E131D"/>
      <stop offset="1" stop-color="#05070B"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEBC0"/>
      <stop offset=".45" stop-color="#D9B46E"/>
      <stop offset="1" stop-color="#9A7334"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A7334" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E9CC8C"/>
      <stop offset="1" stop-color="#9A7334" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3650"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#D9B46E" stroke-opacity=".22" stroke-width="3"/>

  <!-- 바닥 광택 -->
  <ellipse cx="256" cy="384" rx="170" ry="14" fill="#D9B46E" opacity=".18" filter="url(#glow)"/>

  <!-- 차량 정면 -->
  <g>
    <!-- 바퀴 -->
    <rect x="132" y="330" width="50" height="46" rx="12" fill="#7A5A27"/>
    <rect x="330" y="330" width="50" height="46" rx="12" fill="#7A5A27"/>
    <!-- 미러 -->
    <path d="M150 238 h-22 a8 8 0 0 0 0 16 h26z" fill="url(#gold)"/>
    <path d="M362 238 h22 a8 8 0 0 1 0 16 h-26z" fill="url(#gold)"/>
    <!-- 캐빈 -->
    <path d="M146 262 L180 196 Q188 182 204 182 L308 182 Q324 182 332 196 L366 262 Z" fill="url(#gold)"/>
    <path d="M168 254 L194 205 Q199 197 209 197 L303 197 Q313 197 318 205 L344 254 Z" fill="url(#glass)"/>
    <path d="M200 206 L226 206 L196 250 L178 250 Z" fill="#fff" opacity=".08"/>
    <!-- 바디 -->
    <path d="M112 280 Q112 258 134 256 L378 256 Q400 258 400 280 L402 330 Q402 348 384 348 L128 348 Q110 348 110 330 Z" fill="url(#gold)"/>
    <!-- 헤드라이트 (LED) -->
    <path d="M128 282 L206 288 Q212 289 210 296 L206 302 L134 298 Q126 297 126 290 Z" fill="#0B0F17"/>
    <path d="M384 282 L306 288 Q300 289 302 296 L306 302 L378 298 Q386 297 386 290 Z" fill="#0B0F17"/>
    <path d="M136 290 L200 294" stroke="#FFF6DD" stroke-width="4" stroke-linecap="round"/>
    <path d="M376 290 L312 294" stroke="#FFF6DD" stroke-width="4" stroke-linecap="round"/>
    <!-- 그릴 -->
    <rect x="218" y="294" width="76" height="36" rx="10" fill="#0B0F17"/>
    <path d="M228 306 H284 M228 318 H284" stroke="#D9B46E" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- 하단 라인 + 워드마크 -->
  <rect x="136" y="404" width="240" height="2" fill="url(#goldH)"/>
  <text x="256" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="12" fill="#D9B46E">DAEHO</text>
</svg>
